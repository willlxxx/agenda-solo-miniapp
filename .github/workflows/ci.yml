name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenda_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # tests/conftest.py deriva de esto la base agenda_test y la cuenta de administración.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agenda_dev
      JWT_SECRET: secret-de-prueba-ci-01234567890123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      # ../scripts entra también: `cron.py` es parte del despliegue y un linter que no lo ve deja que
      # se cuele ahí lo que en app/ y tests/ se rechaza. Se le apunta el config a pelo porque el repo no
      # tiene pyproject en la raíz, y sin eso ruff usaría sus defectos (88 columnas) para ese archivo.
      - run: ruff check app tests && ruff check --config pyproject.toml ../scripts
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
