[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "agenda-solo-backend"
version = "0.1.0"
description = "Microapp de reservas para clínicas odontológicas unipersonales — backend FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "pydantic>=2.10",
    "httpx>=0.27",
    # SMTP es síncrono: sale del event loop con anyio.to_thread en vez de bloquear la API.
    "anyio>=4.5",
    # Europe/Madrid etc. salen de aquí en Windows; en Linux Railway ya hay /usr/share/zoneinfo.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 es el idiom canónico de FastAPI (Depends en valores por defecto).
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
